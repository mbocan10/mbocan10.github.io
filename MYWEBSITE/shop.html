<!DOCTYPE html>
<html>
<head>
  <title>Shop</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">GameHub</a>

    <div class="ms-auto">
      <a class="nav-link d-inline text-white" href="index.html">Home</a>
      <a class="nav-link d-inline text-white" href="shop.html">Shop</a>
      <a class="nav-link d-inline text-white" href="cart.html">Cart</a>
      <a class="nav-link d-inline text-white" href="support.html">Support</a>
      <a class="nav-link d-inline text-white" href="login.html">Login</a>
    </div>
  </div>
</nav>

<div class="container mt-5 pt-5">
  <h1>Shop</h1>

  <div class="row">

    <div class="col-md-4">
      <div class="card p-3 text-center">
        <img src="images/Controller.jpg">
        <h5>Controller</h5>
        <p>$65</p>
        <button onclick="addToCart('Controller',65)" class="btn btn-success">Add</button>
      </div>
    </div>

    
    <div class="col-md-4">
      <div class="card p-3 text-center">
        <img src="images/PC.jpg">
        <h5>PC</h5>
        <p>$750</p>
        <button onclick="addToCart('PC',750)" class="btn btn-success">Add</button>
      </div>
    </div>

  </div>

  <!-- Table -->
  <h3 class="mt-5">Product Table</h3>
  <table class="table table-bordered">
    <tr><th>Item</th><th>Price</th></tr>
    <tr><td>Controller</td><td>$65</td></tr>
    <tr><td>PC</td><td>$750</td></tr>
  </table>
</div>

<script src="script.js"></script>
</body>
</html>
